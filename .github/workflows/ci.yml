name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install Slither
        run: pip install slither-analyzer

      - name: Show tool versions
        run: |
          forge --version
          python --version
          slither --version

      - name: Build contracts
        run: forge build

      - name: Run full test suite
        run: forge test

      - name: Run invariant suite explicitly
        run: forge test --match-path test/Invariant.t.sol

      - name: Check research script syntax
        run: python -m py_compile scripts/backtest.py

      - name: Run research scenarios
        run: |
          mkdir -p cache
          python scripts/backtest.py --days 90 --tvl 100000 --cycles-per-day 4 --gas-gwei 50 --compare-scenarios --json-out cache/backtest-ci.json

      - name: Install Halmos
        run: pip install halmos

      - name: Run formal verification
        run: python scripts/run_formal.py

      - name: Run Slither
        run: slither . --exclude-dependencies --exclude incorrect-equality,timestamp,low-level-calls,naming-convention,cyclomatic-complexity
